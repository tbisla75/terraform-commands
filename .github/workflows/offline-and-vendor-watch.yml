name: Weekly offline docs and vendor change review
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: vendor-watch
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build fully offline command explanations from current docs
        run: python3 tools/build_offline_reference.py
      - name: Compare official vendor release references
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/vendor_watch.py
      - name: Create review-only pull request if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add offline-reference/ vendor-watch/
          if git diff --cached --quiet; then
            echo "No changes found."
            exit 0
          fi
          DATE="$(date -u +%Y%m%d)"
          BRANCH="automation/vendor-review-$DATE-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "docs: refresh offline commands and vendor watch candidates"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Review vendor changes and refreshed offline commands ($DATE)" \
            --body "Automated detection only. **Do not merge without checking vendor notes, platform version, and command safety.** This PR updates offline documentation and vendor watch status; it does not replace live production commands. Review vendor-watch/CHANGES.md and the generated offline-reference/ index. Update any affected command runbooks manually before merging."
